services:
  qdrant:
    image: qdrant/qdrant:v1.17.0
    profiles: ['rag']
    ports: ['127.0.0.1:6333:6333']
    volumes: ['qdrant_data:/qdrant/storage']
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.3.8
    profiles: ['rag']
    environment:
      discovery.type: single-node
      xpack.security.enabled: 'false'
      ES_JAVA_OPTS: '-Xms512m -Xmx512m'
    ports: ['127.0.0.1:9200:9200']
    volumes: ['elasticsearch_data:/usr/share/elasticsearch/data']
  otel-collector:
    image: otel/opentelemetry-collector:0.145.0
    profiles: ['rag']
    command: ['--config=/etc/otelcol/config.yaml']
    ports: ['127.0.0.1:4318:4318']
    volumes: ['./deploy/otel/collector.yaml:/etc/otelcol/config.yaml:ro']
  postgres:
    image: pgvector/pgvector:pg16
    container_name: rag-postgres
    environment:
      POSTGRES_DB: rag_from_zero
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - 55432:5432
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d rag_from_zero']
      interval: 5s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    container_name: rag-redis
    ports:
      - 6379:6379
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  qdrant_data:
  elasticsearch_data:
  postgres_data:
  redis_data:
